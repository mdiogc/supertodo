{% extends 'base.html' %}
{% load static %}

{% block title %}Add Task{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Add a New Task</h2>
    <form action="{% url 'tasks:add-task' %}" method="post" class="mt-4">
        {% csrf_token %}
        <div class="form-group">
            <label for="taskName">Task Name</label>
            <input type="text" class="form-control" id="taskName" name="name" required>
        </div>
        <div class="form-group">
            <label for="taskDescription">Description</label>
            <textarea class="form-control" id="taskDescription" name="description" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label for="completeBefore">Complete Before</label>
            <input type="date" class="form-control" id="completeBefore" name="complete_before" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>
</div>
{% endblock %}
